seed: 0
goal: complete the ScienceWorld task
episodes: 1
max_steps: 100
tier_refresh_interval: 10

environment:
  name: scienceworld
  root: ${SCIENCEWORLD_ROOT}
  jar_path: ${SCIENCEWORLD_JAR}
  task_name: boil
  variation: 0
  simplifications: easy
  step_limit: 100

planner:
  provider: openai_compatible
  model: ${ADAPTIVEGUARD_LLM_MODEL}
  base_url: ${ADAPTIVEGUARD_LLM_BASE_URL}
  api_key: ${ADAPTIVEGUARD_LLM_API_KEY}
  temperature: 0.0
  timeout: 60
  max_retries: 3

judges:
  provider: openai_compatible
  prj_votes: 3
  hca_hint_votes: 3
  hca_structured_votes: 3

scb:
  theta_low: 0.20
  theta_high: 0.70
  oscillation_window: 10

pft:
  tau: 0.25
  epsilon0: 0.10
  budget_base: 5
  budget_max: 10
  budget_refund: 0.5

cca:
  theta_minus: -0.20
  theta_plus: 0.20
  eta: 0.5
  score_range: 100
  sps_window: 8
  gamma: 0.90

rules:
  path: outputs/rules/scienceworld.json

output:
  directory: outputs
