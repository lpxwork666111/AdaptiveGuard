[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptiveguard"
version = "0.1.0"
description = "Adaptive constraint belief, falsification trials, and contrastive attribution for interactive LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AdaptiveGuard authors"}]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
  "pydantic>=2.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
environments = ["py4j>=0.10.9"]
unity = ["requests>=2.31", "pillow>=10", "opencv-python>=4.8"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.8",
]

[project.scripts]
adaptiveguard = "adaptiveguard.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
